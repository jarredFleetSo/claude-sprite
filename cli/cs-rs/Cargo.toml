[package]
name = "cs"
version = "0.2.0"
edition = "2021"
description = "Claude Sprite CLI — manage remote Claude Code environments"

[[bin]]
name = "cs"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
indicatif = "0.17"
console = "0.15"
dialoguer = "0.11"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
dirs = "6"
which = "7"
unicode-width = "0.2"

[profile.release]
strip = true
lto = true
